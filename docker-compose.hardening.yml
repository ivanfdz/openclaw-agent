# Hardening on top of upstream's docker-compose.yml.
#
# Why it exists: upstream's compose publishes 18789 (Control UI), 18790 (bridge)
# and 3978 (MS Teams) on 0.0.0.0, i.e. reachable from any machine on your LAN.
# The Control UI grants full control of the agent. On a laptop that joins other
# people's wifi, that's not what you want.
#
# `!override` replaces the ports list instead of appending to it (Compose >= 2.24).
# Without the tag you'd end up with the 0.0.0.0 binding AND the loopback one.
services:
  openclaw-gateway:
    ports: !override
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}:18789"
