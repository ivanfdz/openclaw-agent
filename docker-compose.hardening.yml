# Endurecimiento sobre el docker-compose.yml de upstream.
#
# Por qué existe: el compose de upstream publica 18789 (Control UI), 18790 (bridge)
# y 3978 (MS Teams) en 0.0.0.0, es decir accesibles desde cualquier equipo de tu LAN.
# El Control UI da control total del agente. En un portátil que se conecta a wifis
# ajenas eso no interesa.
#
# `!override` reemplaza la lista de ports en vez de concatenarla (Compose >= 2.24).
# Sin el tag acabarías con el binding a 0.0.0.0 Y el de loopback a la vez.
services:
  openclaw-gateway:
    ports: !override
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}:18789"
